<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Playground - ImagEngine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      min-width: 0;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 14px;
      list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-btn { color: var(--accent) !important; font-weight: 600 !important; }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 16px;
    }

    /* Stage: Compact on mobile so parameters stay visible without scroll */
    .stage {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 8px;
    }
    @media (min-width: 768px) {
      .stage { height: 320px; }
    }
    .preview-img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      object-fit: contain;
      transition: opacity 0.15s;
    }
    .preview-img.loading { opacity: 0.3; }
    .spinner {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Ultra-Minimal Controls Card */
    .controls-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .preset-select {
      background: #090d16;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.72rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    /* Fields Grid */
    .fields-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    @media (max-width: 460px) {
      .fields-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .field label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .field input, .field select {
      background: #090d16;
      color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }
    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent);
    }

    /* Effects Row (Checkboxes) */
    .effects-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cb-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .cb-label input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }
    .cb-label:hover {
      color: #fff;
    }

    /* URL Command Bar */
    .url-bar {
      display: flex;
      align-items: center;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 4px 2px 8px;
      gap: 6px;
    }
    .url-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #7dd3fc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      outline: none;
      padding: 5px 0;
    }
    .url-bar button {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .url-bar button:hover {
      background: var(--accent);
      color: #0b0f19;
    }

    .hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: #64748b;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 16px;
      border-top: 1px solid var(--border);
      color: #64748b;
      font-size: 0.78rem;
      margin-top: 16px;
    }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">Imag<span>Engine</span></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/try-yourself.html" class="active">Playground</a></li>
      <li><a href="https://topnepali.com" target="_blank" rel="noopener">Blog</a></li>
      <li><a href="https://topnepali.com/contact" target="_blank" rel="noopener" class="nav-btn">Contact</a></li>
    </ul>
  </nav>

  <main>

    <!-- Stage (Always Top in Mobile Viewport) -->
    <div class="stage">
      <div class="spinner" id="loadingSpinner"></div>
      <img id="previewImg" class="preview-img" alt="Transformed Preview" src="" onload="onLoaded()" onerror="onError()">
    </div>

    <!-- Minimal Controls (Below Image) -->
    <div class="controls-card">

      <div class="card-header">
        <span class="card-title">Transformation Parameters</span>
        <select id="selPreset" class="preset-select" onchange="onPresetSelect(this.value)">
          <option value="">Load Preset...</option>
          <option value="reset">Original (Reset)</option>
          <option value="social">Social OG (1200x630)</option>
          <option value="avatar">Avatar (256x256 Top)</option>
          <option value="mobile">Mobile (320px, q70)</option>
          <option value="noir">Noir (B&amp;W)</option>
          <option value="blur">Blur Placeholder</option>
        </select>
      </div>

      <!-- Enterable Fields Grid (No sliders, direct inputs) -->
      <div class="fields-grid">
        <div class="field">
          <label for="inpW">Width</label>
          <input type="number" id="inpW" placeholder="auto" min="1" max="4000" oninput="onFieldChange()">
        </div>

        <div class="field">
          <label for="inpH">Height</label>
          <input type="number" id="inpH" placeholder="auto" min="1" max="4000" oninput="onFieldChange()">
        </div>

        <div class="field">
          <label for="selFit">Fit</label>
          <select id="selFit" onchange="onFieldChange()">
            <option value="">auto</option>
            <option value="cover">cover</option>
            <option value="contain">contain</option>
            <option value="fill">fill</option>
            <option value="inside">inside</option>
          </select>
        </div>

        <div class="field">
          <label for="selPos">Position</label>
          <select id="selPos" onchange="onFieldChange()">
            <option value="">center</option>
            <option value="top">top</option>
            <option value="bottom">bottom</option>
            <option value="left">left</option>
            <option value="right">right</option>
          </select>
        </div>

        <div class="field">
          <label for="selFmt">Format</label>
          <select id="selFmt" onchange="onFieldChange()">
            <option value="webp">WebP</option>
            <option value="png">PNG</option>
            <option value="jpg">JPEG</option>
          </select>
        </div>

        <div class="field">
          <label for="inpQ">Quality</label>
          <input type="number" id="inpQ" placeholder="auto" min="1" max="100" oninput="onFieldChange()">
        </div>

        <div class="field">
          <label for="inpBlur">Blur</label>
          <input type="number" id="inpBlur" placeholder="0" min="0" max="25" oninput="onFieldChange()">
        </div>

        <div class="field">
          <label for="selRot">Rotate</label>
          <select id="selRot" onchange="onFieldChange()">
            <option value="0">0 deg</option>
            <option value="90">90 deg</option>
            <option value="180">180 deg</option>
            <option value="270">270 deg</option>
          </select>
        </div>
      </div>

      <!-- Effects Row -->
      <div class="effects-row">
        <label class="cb-label">
          <input type="checkbox" id="cbGray" onchange="onFieldChange()"> Grayscale
        </label>
        <label class="cb-label">
          <input type="checkbox" id="cbSharp" onchange="onFieldChange()"> Sharpen
        </label>
        <label class="cb-label">
          <input type="checkbox" id="cbFlipH" onchange="onFieldChange()"> Flip H
        </label>
        <label class="cb-label">
          <input type="checkbox" id="cbFlipV" onchange="onFieldChange()"> Flip V
        </label>
      </div>

      <!-- Live Editable Command / URL Bar -->
      <div class="url-bar">
        <input type="text" id="urlInput" spellcheck="false" onkeydown="if(event.key==='Enter') onManualUrl()" onblur="onManualUrl()">
        <button type="button" id="copyBtn" onclick="copyUrl()">Copy URL</button>
      </div>

    </div>

    <p class="hint">Type values directly into parameter fields or edit the URL.</p>

  </main>

  <footer>
    ImagEngine &bull; Real-Time Image Optimization &bull; Developed by <a href="https://grisma.info.np" target="_blank" rel="noopener">Grisma</a> &bull; <a href="https://topnepali.com" target="_blank" rel="noopener">TopNepali</a>
  </footer>

  <script>
    const BASE_NAME = 'objects.tn/wp-content/uploads/2026/10/nepal-army-rank-hierarchy-insignia-banner';
    let currentUrl = '/' + BASE_NAME + '.webp';
    let debounceTimer = null;

    function getFieldsState() {
      const w = document.getElementById('inpW').value.trim();
      const h = document.getElementById('inpH').value.trim();
      const fit = document.getElementById('selFit').value;
      const pos = document.getElementById('selPos').value;
      const fmt = document.getElementById('selFmt').value;
      const q = document.getElementById('inpQ').value.trim();
      const blur = document.getElementById('inpBlur').value.trim();
      const rot = document.getElementById('selRot').value;
      const gray = document.getElementById('cbGray').checked;
      const sharp = document.getElementById('cbSharp').checked;
      const fliph = document.getElementById('cbFlipH').checked;
      const flipv = document.getElementById('cbFlipV').checked;

      // Determine path
      let path = '/' + BASE_NAME;
      if (fmt === 'webp') {
        path += '.webp';
      } else {
        path += '-webp.' + fmt;
      }

      // Determine search query
      const params = new URLSearchParams();
      if (w && parseInt(w) > 0) params.set('w', w);
      if (h && parseInt(h) > 0) params.set('h', h);
      if (fit) params.set('fit', fit);
      if (pos) params.set('position', pos);
      if (q && parseInt(q) > 0) params.set('q', q);
      if (blur && parseInt(blur) > 0) params.set('blur', blur);
      if (rot && rot !== '0') params.set('rotate', rot);
      if (gray) params.set('grayscale', '1');
      if (sharp) params.set('sharpen', '1');
      if (fliph) params.set('flip', 'h');
      if (flipv) params.set('flop', '1');

      const qs = params.toString();
      return path + (qs ? '?' + qs : '');
    }

    function onFieldChange() {
      const newUrl = getFieldsState();
      applyUrl(newUrl, false);
    }

    function applyUrl(url, syncInputs = true) {
      if (!url.startsWith('/')) url = '/' + url;
      currentUrl = url;
      document.getElementById('urlInput').value = url;

      if (syncInputs) {
        syncInputsFromUrl(url);
      }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const img = document.getElementById('previewImg');
        const spinner = document.getElementById('loadingSpinner');
        spinner.style.display = 'block';
        img.classList.add('loading');
        img.src = currentUrl;
      }, 120);
    }

    function syncInputsFromUrl(url) {
      const parsed = new URL(window.location.origin + url);
      const qs = parsed.searchParams;

      // Format
      const selFmt = document.getElementById('selFmt');
      if (parsed.pathname.includes('.png')) selFmt.value = 'png';
      else if (parsed.pathname.includes('.jpg') || parsed.pathname.includes('.jpeg')) selFmt.value = 'jpg';
      else selFmt.value = 'webp';

      // Width & Height
      document.getElementById('inpW').value = qs.get('w') || '';
      document.getElementById('inpH').value = qs.get('h') || '';

      // Fit & Position
      document.getElementById('selFit').value = qs.get('fit') || '';
      document.getElementById('selPos').value = qs.get('position') || '';

      // Quality & Blur
      document.getElementById('inpQ').value = qs.get('q') || '';
      document.getElementById('inpBlur').value = qs.get('blur') || '';

      // Rotate
      const rot = qs.get('rotate') || '0';
      document.getElementById('selRot').value = ['0', '90', '180', '270'].includes(rot) ? rot : '0';

      // Effects
      document.getElementById('cbGray').checked = qs.get('grayscale') === '1';
      document.getElementById('cbSharp').checked = qs.get('sharpen') === '1';
      document.getElementById('cbFlipH').checked = qs.get('flip') === 'h';
      document.getElementById('cbFlipV').checked = qs.get('flop') === '1';
    }

    function onPresetSelect(name) {
      if (!name) return;
      if (name === 'reset') {
        applyUrl('/' + BASE_NAME + '.webp', true);
      } else if (name === 'social') {
        applyUrl('/' + BASE_NAME + '.webp?w=1200&h=630&fit=cover', true);
      } else if (name === 'avatar') {
        applyUrl('/' + BASE_NAME + '.webp?w=256&h=256&fit=cover&position=top', true);
      } else if (name === 'mobile') {
        applyUrl('/' + BASE_NAME + '.webp?w=320&q=70', true);
      } else if (name === 'noir') {
        applyUrl('/' + BASE_NAME + '.webp?grayscale=1&sharpen=1', true);
      } else if (name === 'blur') {
        applyUrl('/' + BASE_NAME + '.webp?w=400&blur=8', true);
      }
      document.getElementById('selPreset').value = '';
    }

    function onManualUrl() {
      const val = document.getElementById('urlInput').value.trim();
      if (val && val !== currentUrl) {
        applyUrl(val, true);
      }
    }

    function onLoaded() {
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('previewImg').classList.remove('loading');
    }

    function onError() {
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('previewImg').classList.remove('loading');
    }

    function copyUrl() {
      const full = window.location.origin + currentUrl;
      navigator.clipboard.writeText(full).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy URL', 1500);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyUrl('/' + BASE_NAME + '.webp', true);
    });
  </script>

</body>
</html>
