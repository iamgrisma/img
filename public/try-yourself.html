<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Playground - ImagEngine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      min-width: 0;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 14px;
      list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-btn { color: var(--accent) !important; font-weight: 600 !important; }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 16px;
    }

    /* Stage: Compact on mobile so parameters stay visible without scroll */
    .stage {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 8px;
    }
    @media (min-width: 768px) {
      .stage { height: 340px; }
    }
    .preview-img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      object-fit: contain;
      transition: opacity 0.15s;
    }
    .preview-img.loading { opacity: 0.3; }
    .spinner {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Ultra-Minimal Controls Card */
    .controls-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .control-group label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .control-group select {
      background: #090d16;
      color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.15s;
    }
    .control-group select:focus {
      border-color: var(--accent);
    }

    /* Effects Row (Checkboxes) */
    .effects-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cb-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .cb-label input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }
    .cb-label:hover {
      color: #fff;
    }

    /* URL Command Bar */
    .url-bar {
      display: flex;
      align-items: center;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 4px 2px 8px;
      gap: 6px;
    }
    .url-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #7dd3fc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      outline: none;
      padding: 6px 0;
    }
    .url-bar button {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .url-bar button:hover {
      background: var(--accent);
      color: #0b0f19;
    }

    .hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: #64748b;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 16px;
      border-top: 1px solid var(--border);
      color: #64748b;
      font-size: 0.78rem;
      margin-top: 16px;
    }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">Imag<span>Engine</span></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/try-yourself.html" class="active">Playground</a></li>
      <li><a href="https://topnepali.com" target="_blank" rel="noopener">Blog</a></li>
      <li><a href="https://topnepali.com/contact" target="_blank" rel="noopener" class="nav-btn">Contact</a></li>
    </ul>
  </nav>

  <main>

    <!-- Stage (Always Top in Mobile Viewport) -->
    <div class="stage">
      <div class="spinner" id="loadingSpinner"></div>
      <img id="previewImg" class="preview-img" alt="Transformed Preview" src="" onload="onLoaded()" onerror="onError()">
    </div>

    <!-- Minimal Controls (Below Image) -->
    <div class="controls-card">

      <div class="controls-grid">
        <div class="control-group">
          <label for="presetSelect">Preset</label>
          <select id="presetSelect" onchange="onPresetChange(this.value)">
            <option value="original">Original</option>
            <option value="social">Social Card (1200x630)</option>
            <option value="avatar">Avatar (256x256)</option>
            <option value="mobile">Mobile (320px)</option>
            <option value="noir">Noir (B&amp;W)</option>
            <option value="blur">Blur Placeholder</option>
            <option value="custom" disabled>Custom</option>
          </select>
        </div>

        <div class="control-group">
          <label for="formatSelect">Format</label>
          <select id="formatSelect" onchange="onFormatChange(this.value)">
            <option value="webp">WebP</option>
            <option value="png">PNG</option>
            <option value="jpg">JPEG</option>
          </select>
        </div>

        <div class="control-group">
          <label for="rotateSelect">Rotation</label>
          <select id="rotateSelect" onchange="onRotateChange(this.value)">
            <option value="0">0 deg</option>
            <option value="90">90 deg</option>
            <option value="180">180 deg</option>
            <option value="270">270 deg</option>
          </select>
        </div>
      </div>

      <div class="effects-row">
        <label class="cb-label">
          <input type="checkbox" id="cbGray" onchange="onToggleEffect('grayscale', this.checked)"> Grayscale
        </label>
        <label class="cb-label">
          <input type="checkbox" id="cbSharp" onchange="onToggleEffect('sharpen', this.checked)"> Sharpen
        </label>
        <label class="cb-label">
          <input type="checkbox" id="cbFlipH" onchange="onToggleEffect('flip', this.checked)"> Flip H
        </label>
        <label class="cb-label">
          <input type="checkbox" id="cbFlipV" onchange="onToggleEffect('flop', this.checked)"> Flip V
        </label>
      </div>

      <div class="url-bar">
        <input type="text" id="urlInput" spellcheck="false" onkeydown="if(event.key==='Enter') onManualUrl()" onblur="onManualUrl()">
        <button type="button" id="copyBtn" onclick="copyUrl()">Copy URL</button>
      </div>

    </div>

    <p class="hint">Adjust controls or edit query parameters directly in the URL bar.</p>

  </main>

  <footer>
    ImagEngine &bull; Real-Time Image Optimization &bull; Developed by <a href="https://grisma.info.np" target="_blank" rel="noopener">Grisma</a> &bull; <a href="https://topnepali.com" target="_blank" rel="noopener">TopNepali</a>
  </footer>

  <script>
    const BASE_PATH = 'objects.tn/wp-content/uploads/2026/10/nepal-army-rank-hierarchy-insignia-banner.webp';
    let currentUrl = '/' + BASE_PATH;
    let debounceTimer = null;

    function applyUrl(url) {
      if (!url.startsWith('/')) url = '/' + url;
      currentUrl = url;
      document.getElementById('urlInput').value = url;
      syncControlsFromUrl(url);

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const img = document.getElementById('previewImg');
        const spinner = document.getElementById('loadingSpinner');
        spinner.style.display = 'block';
        img.classList.add('loading');
        img.src = currentUrl;
      }, 120);
    }

    function onManualUrl() {
      const val = document.getElementById('urlInput').value.trim();
      if (val && val !== currentUrl) {
        applyUrl(val);
      }
    }

    function onLoaded() {
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('previewImg').classList.remove('loading');
    }

    function onError() {
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('previewImg').classList.remove('loading');
    }

    function copyUrl() {
      const full = window.location.origin + currentUrl;
      navigator.clipboard.writeText(full).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy URL', 1500);
      });
    }

    function onPresetChange(val) {
      if (val === 'original') {
        applyUrl('/' + BASE_PATH);
      } else if (val === 'social') {
        applyUrl('/' + BASE_PATH + '?w=1200&h=630&fit=cover');
      } else if (val === 'avatar') {
        applyUrl('/' + BASE_PATH + '?w=256&h=256&fit=cover&position=top');
      } else if (val === 'mobile') {
        applyUrl('/' + BASE_PATH + '?w=320&q=70');
      } else if (val === 'noir') {
        applyUrl('/' + BASE_PATH + '?grayscale=1&sharpen=1');
      } else if (val === 'blur') {
        applyUrl('/' + BASE_PATH + '?w=400&blur=8');
      }
    }

    function onFormatChange(fmt) {
      const parsed = new URL(window.location.origin + currentUrl);
      let path = parsed.pathname;
      if (fmt === 'webp') {
        path = path.replace(/-webp\.(png|jpg|jpeg)/, '.webp').replace(/\.(png|jpg|jpeg)$/, '.webp');
      } else {
        path = path.replace(/\.webp$/, '-webp.' + fmt).replace(/-webp\.(png|jpg|jpeg)$/, '-webp.' + fmt);
      }
      const qs = parsed.searchParams.toString();
      applyUrl(path + (qs ? '?' + qs : ''));
    }

    function onRotateChange(deg) {
      const parsed = new URL(window.location.origin + currentUrl);
      if (deg === '0') {
        parsed.searchParams.delete('rotate');
      } else {
        parsed.searchParams.set('rotate', deg);
      }
      const qs = parsed.searchParams.toString();
      applyUrl(parsed.pathname + (qs ? '?' + qs : ''));
    }

    function onToggleEffect(key, checked) {
      const parsed = new URL(window.location.origin + currentUrl);
      if (key === 'grayscale') {
        if (checked) parsed.searchParams.set('grayscale', '1');
        else parsed.searchParams.delete('grayscale');
      } else if (key === 'sharpen') {
        if (checked) parsed.searchParams.set('sharpen', '1');
        else parsed.searchParams.delete('sharpen');
      } else if (key === 'flip') {
        if (checked) parsed.searchParams.set('flip', 'h');
        else parsed.searchParams.delete('flip');
      } else if (key === 'flop') {
        if (checked) parsed.searchParams.set('flop', '1');
        else parsed.searchParams.delete('flop');
      }
      const qs = parsed.searchParams.toString();
      applyUrl(parsed.pathname + (qs ? '?' + qs : ''));
    }

    function syncControlsFromUrl(url) {
      const parsed = new URL(window.location.origin + url);
      const qs = parsed.searchParams;

      // Format select
      const formatSelect = document.getElementById('formatSelect');
      if (parsed.pathname.includes('.png')) formatSelect.value = 'png';
      else if (parsed.pathname.includes('.jpg') || parsed.pathname.includes('.jpeg')) formatSelect.value = 'jpg';
      else formatSelect.value = 'webp';

      // Rotate select
      const rot = qs.get('rotate') || '0';
      document.getElementById('rotateSelect').value = ['0', '90', '180', '270'].includes(rot) ? rot : '0';

      // Checkboxes
      document.getElementById('cbGray').checked = qs.get('grayscale') === '1';
      document.getElementById('cbSharp').checked = qs.get('sharpen') === '1';
      document.getElementById('cbFlipH').checked = qs.get('flip') === 'h';
      document.getElementById('cbFlipV').checked = qs.get('flop') === '1';

      // Preset select
      const presetSelect = document.getElementById('presetSelect');
      const search = parsed.search;
      if (!search && formatSelect.value === 'webp') {
        presetSelect.value = 'original';
      } else if (search === '?w=1200&h=630&fit=cover') {
        presetSelect.value = 'social';
      } else if (search === '?w=256&h=256&fit=cover&position=top') {
        presetSelect.value = 'avatar';
      } else if (search === '?w=320&q=70') {
        presetSelect.value = 'mobile';
      } else if (search === '?grayscale=1&sharpen=1') {
        presetSelect.value = 'noir';
      } else if (search === '?w=400&blur=8') {
        presetSelect.value = 'blur';
      } else {
        presetSelect.value = 'custom';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyUrl('/' + BASE_PATH);
    });
  </script>

</body>
</html>
